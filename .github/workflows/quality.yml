---
name: quality

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Run ruff
        run: uvx ruff check --no-cache runner tests scripts fuzz

      - name: Run pyright
        run: >-
          uv run
          --with-requirements runner/requirements-dev.txt
          --with pyright
          pyright runner tests scripts fuzz

      - name: Audit Python dependencies
        run: >-
          uv run
          --with-requirements runner/requirements-dev.txt
          --with pip-audit
          pip-audit

      - name: Run Bandit
        run: >-
          uvx bandit
          -q
          -r runner scripts fuzz
          -x tests
          -s B404,B603,B607

      - name: Validate dependency SBOM
        run: python scripts/validate_dependency_sbom.py

      - name: Validate dependency lock
        run: scripts/validate_dependency_lock.sh

      - name: Dry-run release asset builder
        run: |
          git show v0.1.4:runner/requirements.txt \
            > /tmp/dvaac-runner-requirements.txt
          git show v0.1.4:runner/requirements-dev.txt \
            > /tmp/dvaac-runner-requirements-dev.txt
          uv pip install --system -r /tmp/dvaac-runner-requirements.txt
          uv pip install --system -r /tmp/dvaac-runner-requirements-dev.txt
          AAC_COMMIT="$(python3 - <<'PY'
          import json
          import subprocess

          raw = subprocess.check_output([
              "git",
              "show",
              "v0.1.4:corpus.manifest.json",
          ])
          manifest = json.loads(raw)
          print(manifest["aac_compatibility"]["aac_commit"])
          PY
          )"
          git clone https://github.com/jlov7/agent-assurance-case /tmp/aac
          git -C /tmp/aac checkout "$AAC_COMMIT"
          AAC_VERIFIER_PATH=/tmp/aac/verifier/verify.py \
            scripts/build_release_assets.sh v0.1.4 /tmp/dvaac-release-assets

      - name: Run codespell
        run: uvx codespell . --skip './.git,./.venv,./dist'

      - name: Check REUSE licensing metadata
        run: uvx reuse lint

      - name: Check Markdown local links
        run: python scripts/check_markdown_links.py

      - name: Check public artifact hygiene
        run: python scripts/check_public_hygiene.py

      - name: Validate Security Insights metadata
        run: scripts/validate_security_insights.sh

      - name: Validate repository posture metadata
        run: >-
          uv run
          --with-requirements runner/requirements.txt
          python scripts/verify_repository_posture.py

      - name: Validate CodeMeta metadata
        run: >-
          uv run
          --with-requirements runner/requirements.txt
          python scripts/validate_codemeta.py

      - name: Validate citation metadata
        run: >-
          uv run
          --with-requirements runner/requirements.txt
          python scripts/validate_citation.py

      - name: Validate external-validation status
        run: python scripts/validate_external_validation_status.py

      - name: Validate CFF syntax
        run: >-
          uvx --from cffconvert
          cffconvert --validate --infile CITATION.cff

      - name: Run shellcheck
        run: >-
          uvx --from shellcheck-py
          shellcheck
          .clusterfuzzlite/build.sh
          VERIFY-PUBLICATION-READY.sh
          scripts/build_release_assets.sh
          scripts/validate_dependency_lock.sh
          scripts/validate_security_insights.sh
