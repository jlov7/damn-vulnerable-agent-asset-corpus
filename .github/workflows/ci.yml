name: dvaac-conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout DVAAC
        uses: actions/checkout@v6.0.2
        with:
          path: dvaac

      - name: Checkout AAC reference verifier
        uses: actions/checkout@v6.0.2
        with:
          repository: jlov7/agent-assurance-case
          ref: 1fd8f644f55195b5dc90a81896b1bbdec3d9daee
          path: agent-assurance-case

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install runner dependencies
        run: |
          uv pip install --system -r dvaac/runner/requirements.txt
          uv pip install --system -r dvaac/runner/requirements-dev.txt

      - name: Compile runner
        run: python -m py_compile dvaac/runner/verify_fixtures.py dvaac/runner/write_release_manifest.py

      - name: Validate committed JSON files
        working-directory: dvaac
        run: |
          while IFS= read -r file; do
            python -m json.tool "$file" >/dev/null
          done < <(find . -path ./.git -prune -o -path ./dist -prune -o -name '*.json' -type f -print | sort)

      - name: Validate citation metadata
        working-directory: dvaac
        run: uvx --from cffconvert cffconvert --validate --infile CITATION.cff

      - name: Run DVAAC fixture conformance gate
        env:
          AAC_VERIFIER_PATH: ${{ github.workspace }}/agent-assurance-case/verifier/verify.py
        run: python dvaac/runner/verify_fixtures.py

      - name: Verify signed AAC emission
        working-directory: dvaac
        run: |
          make write-signed
          test "$(find dist/signed-aac -type f -name '*-signed-aac.json' | wc -l | tr -d ' ')" = "16"
          test -f dist/signed-aac/RELEASE-MANIFEST.json
          test "$(wc -l < dist/signed-aac/SHA256SUMS | tr -d ' ')" = "22"
          python - <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "runner")
          import verify_fixtures

          aac_module = verify_fixtures.load_aac_verifier(Path("../agent-assurance-case/verifier/verify.py"))
          manifest = json.loads(Path("dist/signed-aac/RELEASE-MANIFEST.json").read_text(encoding="utf-8"))
          signature = manifest.pop("signature")
          _, public_key = aac_module._demo_keypair()
          public_key.verify(
              base64.b64decode(signature["value"].removeprefix("ed25519:")),
              aac_module.canonicalize(manifest),
          )
          PY

      - name: Verify pytest collection safety
        working-directory: dvaac
        run: |
          rm -f /tmp/dvaac_hidden_test_payload.txt
          python -m pytest --collect-only -q || test $? -eq 5
          test ! -e /tmp/dvaac_hidden_test_payload.txt

      - name: Block pytest-discoverable fixture payload names
        working-directory: dvaac
        run: |
          matches="$(find fixtures -type f \( -name 'test_*.py' -o -name '*_test.py' -o -name 'conftest.py' \) -print)"
          test -z "$matches" || { echo "$matches"; exit 1; }

      - name: Negative test evidence tamper detection
        env:
          AAC_VERIFIER_PATH: ${{ github.workspace }}/agent-assurance-case/verifier/verify.py
        run: |
          tmp="$(mktemp -d)"
          cp -R dvaac "$tmp/dvaac"
          printf '\ncorruption\n' >> "$tmp/dvaac/fixtures/05-shadow-skill-from-trace/evidence/traces/otel-genai.jsonl"
          set +e
          python "$tmp/dvaac/runner/verify_fixtures.py" > "$tmp/out.txt" 2>&1
          rc=$?
          set -e
          cat "$tmp/out.txt"
          test "$rc" -eq 1

      - name: Negative test fixture symlink rejection
        env:
          AAC_VERIFIER_PATH: ${{ github.workspace }}/agent-assurance-case/verifier/verify.py
        run: |
          tmp="$(mktemp -d)"
          cp -R dvaac "$tmp/dvaac"
          ln -s /tmp "$tmp/dvaac/fixtures/01-clean-declared-skill/skill/symlink-dir"
          set +e
          python "$tmp/dvaac/runner/verify_fixtures.py" > "$tmp/out.txt" 2>&1
          rc=$?
          set -e
          cat "$tmp/out.txt"
          test "$rc" -eq 1
